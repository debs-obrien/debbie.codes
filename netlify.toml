[build]
command = "npm run generate"
publish = "dist"
ignore = "git log -1 --pretty=%B | grep dependabot"

[[redirects]]
from = "/talks"
to = "/speaking"
status = 301
force = true

[[redirects]]
from = "/talks/"
to = "/speaking"
status = 301
force = true

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"

[[headers]]
for = "/images/content/*"

[headers.values]
Cache-Control = "public, max-age=2592000"

[images]
remote_images = [
  "dev-to-uploads.s3.amazonaws.com",
  "raw.githubusercontent.com",
  "theaiplatform.app"
]

[build.environment]
NODE_VERSION = "22.23.3"
