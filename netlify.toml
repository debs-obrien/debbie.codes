[build]
command = "npm run generate"
publish = "dist"
ignore = "git log -1 --pretty=%B | grep dependabot"

[[redirects]]
from = "/talks"
to = "/speaking"
status = 301
force = true

[[redirects]]
from = "/talks/"
to = "/speaking"
status = 301
force = true

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"

[[headers]]
for = "/images/*"

[headers.values]
# Filenames are not content-hashed — use Netlify Image CDN documented caching.
# Transformed `/.netlify/images` responses inherit these source headers.
Cache-Control = "public, max-age=604800, must-revalidate"

[images]
# Anchored regex (single-quoted). Keep in sync with utils/remote-images.ts.
remote_images = [
  'https://dev-to-uploads\.s3\.amazonaws\.com/.*',
  'https://raw\.githubusercontent\.com/.*',
  'https://theaiplatform\.app/.*'
]

[build.environment]
NODE_VERSION = "22.23.3"
