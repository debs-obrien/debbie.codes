<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form detection</title>
</head>
<body>
  <!--
    Build-time registration only so Netlify creates the `contact` form.
    Public POSTs without the Function's HMAC proof are blocked by
    netlify/edge-functions/guard-contact-form.ts. Real submissions come from
    netlify/functions/contact.ts after validation + rate limiting.
  -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="company-website" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="text" name="reason">
    <textarea name="message"></textarea>
    <input type="text" name="company-website">
  </form>
</body>
</html>
