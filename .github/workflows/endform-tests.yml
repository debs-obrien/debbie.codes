name: Endform on Netlify Preview

# Runs the Playwright suite on Endform's cloud runners against a deploy preview
# for a PR — the parallel counterpart to preview-tests.yml. Default host remains
# Netlify (unchanged). Optional Vercel via workflow_dispatch preview_host/base_url.
#
# Auth: Endform uses OIDC (no secret token). The Endform GitHub App must be
# installed and this repo connected in the Endform dashboard, and the job needs
# `id-token: write`. See https://endform.dev/docs/guides/getting-started
#
# Preview URL: same resolution as preview-tests.yml (Netlify status by default;
# Vercel status with vercel.app target_url when preview_host=vercel).

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_url:
        description: Preview URL to test (skips polling). Netlify or Vercel.
        required: false
        type: string
      preview_host:
        description: 'When base_url is empty, which commit status to poll'
        required: false
        type: choice
        default: netlify
        options:
          - netlify
          - vercel

permissions:
  contents: read
  statuses: read
  id-token: write # required for OIDC authentication with Endform

jobs:
  resolve-preview:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
    steps:
      - name: Resolve preview URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_URL: ${{ github.event.inputs.base_url }}
          PREVIEW_HOST: ${{ github.event.inputs.preview_host || 'netlify' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_URL:-}" ]; then
            echo "Using manually supplied URL: $MANUAL_URL"
            echo "base_url=$MANUAL_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::No PR head SHA and no manual base_url. On workflow_dispatch, supply the 'base_url' input."
            exit 1
          fi
          HOST="${PREVIEW_HOST:-netlify}"
          echo "Preview host: $HOST"
          for i in $(seq 1 60); do
            if [ "$HOST" = "vercel" ]; then
              READ=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
                --jq '[.[] | select(.state=="success" and (.target_url|tostring|test("vercel\\.app")))][0] | "\(.state)\t\(.target_url)"' \
                2>/dev/null || echo "")
              LABEL="Vercel (vercel.app status)"
            else
              CONTEXT="netlify/debbiecodes/deploy-preview"
              READ=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
                --jq "[.[] | select(.context == \"$CONTEXT\")][0] | \"\(.state)\t\(.target_url)\"" \
                2>/dev/null || echo "")
              LABEL="Netlify ($CONTEXT)"
            fi
            STATE="${READ%%$'\t'*}"
            URL="${READ#*$'\t'}"
            echo "attempt $i ($LABEL): state='${STATE:-none}' url='${URL:-none}'"
            case "$STATE" in
              success)
                if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                  echo "Preview ready: $URL"
                  echo "base_url=$URL" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
              failure|error)
                if [ "$HOST" != "vercel" ]; then
                  echo "::error::Netlify preview reported '$STATE'. Aborting."
                  exit 1
                fi
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for $HOST preview status."
          exit 1

      - name: Verify preview responds with HTTP 200
        run: |
          set -euo pipefail
          URL="${{ steps.resolve.outputs.base_url }}"
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL" || echo "000")
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "Preview is live."; exit 0; }
            sleep 5
          done
          echo "::error::Preview URL never returned HTTP 200."
          exit 1

  endform-tests:
    needs: resolve-preview
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Endform transfers env vars referenced by the Playwright config to its
      # runners. Both names are set so the config resolves the preview URL
      # regardless of which one it reads.
      BASE_URL: ${{ needs.resolve-preview.outputs.base_url }}
      PLAYWRIGHT_TEST_BASE_URL: ${{ needs.resolve-preview.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install dependencies
        run: npm ci
      - name: Run tests on Endform
        run: npx endform test
