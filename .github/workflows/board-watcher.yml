name: Board watcher

# Runs unit tests and a production typecheck for the standalone board-watcher
# Next.js app. Vitest alone does not catch BoardEventView assignability errors
# that break `next build` on Vercel.

on:
  pull_request:
    paths:
      - board-watcher/**
      - .github/workflows/board-watcher.yml
  push:
    branches: [main, master]
    paths:
      - board-watcher/**
      - .github/workflows/board-watcher.yml

permissions:
  contents: read

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board-watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: board-watcher/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
